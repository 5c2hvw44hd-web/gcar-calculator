<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a1120">
<title>카쉐어링 업체 선택</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
<style>
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Malgun Gothic",sans-serif;
    color:#f5f7fb;
    padding:60px 16px;
    min-height:100vh;
    background:
      radial-gradient(700px circle at 8% -15%, rgba(218,41,28,0.28), transparent 58%),
      radial-gradient(620px circle at 108% 0%, rgba(34,74,140,0.32), transparent 55%),
      linear-gradient(165deg, #060b14 0%, #0c1729 45%, #0a1120 100%);
    background-attachment:fixed;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
  }
  .title{
    text-align:center;
    font-size:20px;
    font-weight:700;
    margin-bottom:6px;
  }
  .sub{
    text-align:center;
    font-size:12px;
    color:rgba(245,247,251,0.5);
    margin-bottom:28px;
  }
  .option{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.32);
    text-decoration:none;
    margin-bottom:14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.35);
    transition:transform .15s ease;
  }
  .option:active{ transform:scale(0.98); }
  .option .badge{
    width:40px;
    height:40px;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    color:#fff;
    font-size:15px;
    flex-shrink:0;
  }
  .option .name{
    font-size:16px;
    font-weight:700;
    color:#fff;
  }
  .option .desc{
    font-size:12px;
    color:rgba(255,255,255,0.75);
  }
  .option.gcar{
    background:linear-gradient(160deg, rgba(218,41,28,0.85), rgba(150,20,15,0.75));
    box-shadow:0 12px 28px rgba(218,41,28,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .option.socar{
    background:linear-gradient(160deg, rgba(14,165,233,0.85), rgba(8,111,161,0.78));
    box-shadow:0 12px 28px rgba(14,165,233,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .option.turucar{
    background:linear-gradient(160deg, rgba(255,143,15,0.9), rgba(196,102,5,0.82));
    box-shadow:0 12px 28px rgba(255,143,15,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .option.disabled{
    opacity:0.45;
    cursor:default;
    filter:grayscale(0.3);
  }
  .soon{
    margin-left:auto;
    font-size:10.5px;
    font-weight:700;
    padding:4px 8px;
    border-radius:999px;
    background:rgba(255,255,255,0.2);
    color:#fff;
    flex-shrink:0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">카쉐어링 업체 선택</div>
  <div class="sub">이용할 업체를 선택하세요</div>

  <a class="option gcar" href="gcar.html">
    <div class="badge">G</div>
    <div>
      <div class="name">G Car</div>
      <div class="desc">롯데렌터카</div>
    </div>
  </a>

  <div class="option socar disabled">
    <div class="badge">S</div>
    <div>
      <div class="name">SoCar</div>
      <div class="desc">쏘카</div>
    </div>
    <div class="soon">준비중</div>
  </div>

  <div class="option turucar disabled">
    <div class="badge">T</div>
    <div>
      <div class="name">Turu Car</div>
      <div class="desc">투루카</div>
    </div>
    <div class="soon">준비중</div>
  </div>
</div>
</body>
</html>
