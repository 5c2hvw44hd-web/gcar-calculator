<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a1120">
<title>G CAR 주행요금 및 포인트 계산</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --accent:#DA291C;
    --accent-soft:rgba(218,41,28,0.35);
    --navy:#0d1a2e;
    --glass:rgba(255,255,255,0.07);
    --glass-strong:rgba(255,255,255,0.11);
    --glass-border:rgba(255,255,255,0.16);
    --glass-border-strong:rgba(255,255,255,0.32);
    --text:#f5f7fb;
    --text-secondary:rgba(245,247,251,0.62);
    --text-muted:rgba(245,247,251,0.38);
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Malgun Gothic",sans-serif;
    color:var(--text);
    padding:40px 16px 60px;
    min-height:100vh;
    background:
      radial-gradient(900px circle at 10% -10%, rgba(218,41,28,0.38), transparent 58%),
      radial-gradient(760px circle at 105% 0%, rgba(34,74,140,0.40), transparent 55%),
      radial-gradient(900px circle at 50% 115%, rgba(218,41,28,0.22), transparent 60%),
      linear-gradient(165deg, #060b14 0%, #0c1729 45%, #0a1120 100%);
    background-attachment:fixed;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
  }
  .header-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:8px;
  }
  h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
    background:linear-gradient(135deg, #ffffff, rgba(255,255,255,0.75));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  h1 .dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px 2px var(--accent-soft);
    margin-right:8px;
    vertical-align:middle;
  }
  .version-badge{
    font-size:11px;
    line-height:1.5;
    color:var(--text-muted);
    text-align:right;
    white-space:nowrap;
    padding-top:3px;
  }
  .note{
    font-size:11.5px;
    color:var(--text-muted);
    margin:0 0 20px;
  }
  .sub{
    color:var(--text-secondary);
    font-size:13px;
    margin:0 0 24px;
  }
  .card{
    position:relative;
    background:linear-gradient(160deg, var(--glass-strong), var(--glass));
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    backdrop-filter:blur(28px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:26px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:
      0 20px 50px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 0 0 1px rgba(255,255,255,0.03);
  }
  .field{
    margin-bottom:14px;
  }
  .field:last-child{margin-bottom:0;}
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--text-secondary);
    margin-bottom:7px;
  }
  select, input[type="number"]{
    width:100%;
    height:44px;
    padding:0 14px;
    border:1px solid var(--glass-border);
    border-radius:14px;
    font-size:15px;
    background:rgba(255,255,255,0.06);
    color:var(--text);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
  }
  select option{
    color:#111;
  }
  select:focus, input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  button{
    width:100%;
    height:46px;
    border:1px solid var(--glass-border-strong);
    border-radius:999px;
    background:linear-gradient(135deg, rgba(218,41,28,0.95), rgba(150,20,15,0.92));
    color:#fff;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.01em;
    cursor:pointer;
    margin-top:6px;
    box-shadow:
      0 12px 28px rgba(218,41,28,0.4),
      inset 0 1px 0 rgba(255,255,255,0.4);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button:hover{ box-shadow:0 14px 32px rgba(218,41,28,0.5), inset 0 1px 0 rgba(255,255,255,0.4); }
  button:active{ transform:scale(0.98); }

  .compare-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:20px;
  }
  .compare-box{
    background:linear-gradient(160deg, var(--glass-strong), var(--glass));
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    border:1px solid var(--glass-border);
    border-radius:20px;
    padding:18px 12px;
    text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.18);
    transition:background .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .compare-box .label{
    font-size:12.5px;
    color:var(--text-secondary);
    margin-bottom:8px;
  }
  .compare-box .value{
    font-size:25px;
    font-weight:700;
    color:var(--text);
  }
  .compare-box.highlight{
    background:linear-gradient(160deg, rgba(218,41,28,0.85), rgba(150,20,15,0.75));
    border-color:rgba(255,255,255,0.4);
    box-shadow:
      0 12px 30px rgba(218,41,28,0.45),
      inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .compare-box.highlight .label,
  .compare-box.highlight .value{
    color:#fff;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-bottom:20px;
  }
  .pct-card{
    background:linear-gradient(160deg, var(--glass-strong), var(--glass));
    -webkit-backdrop-filter:blur(18px);
    backdrop-filter:blur(18px);
    border:1px solid var(--glass-border);
    border-radius:16px;
    padding:12px 8px;
    text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.16);
    transition:background .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .pct-card .pct{
    font-size:12px;
    color:var(--text-secondary);
    font-weight:600;
    margin-bottom:5px;
  }
  .pct-card .amt{
    font-size:15px;
    font-weight:700;
    color:var(--text);
  }
  .pct-card.highlight{
    background:linear-gradient(160deg, rgba(218,41,28,0.85), rgba(150,20,15,0.75));
    border-color:rgba(255,255,255,0.4);
    box-shadow:
      0 10px 24px rgba(218,41,28,0.4),
      inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .pct-card.highlight .pct,
  .pct-card.highlight .amt{
    color:#fff;
  }

  .tier-title{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--text-secondary);
    margin-bottom:9px;
  }
  .tier-table{
    background:var(--glass);
    -webkit-backdrop-filter:blur(18px);
    backdrop-filter:blur(18px);
    border:1px solid var(--glass-border);
    border-radius:18px;
    overflow:hidden;
    font-size:13px;
  }
  .tier-row{
    display:grid;
    grid-template-columns:1.1fr 1fr 0.8fr 1.1fr;
    padding:10px 14px;
  }
  .tier-row + .tier-row{
    border-top:1px solid rgba(255,255,255,0.10);
  }
  .tier-row.head{
    background:rgba(255,255,255,0.05);
    color:var(--text-secondary);
    font-weight:600;
    font-size:11.5px;
    letter-spacing:0.02em;
  }
  .tier-row span:not(:first-child){
    text-align:right;
  }
  .tier-row.zero{
    color:var(--text-muted);
  }
  @media (max-width:480px){
    .grid{ grid-template-columns:repeat(2, 1fr); }
    .tier-row{ font-size:12px; }
    .compare-box .value{ font-size:20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <h1><span class="dot"></span>G CAR 주행요금 및 포인트 계산</h1>
    <div class="version-badge">v1.0<br>2026.08.09</div>
  </div>
  <p class="note">*31-100km 구간은 적게는 10원 크게는 20원까지 차이날 수 있음</p>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="vehicle">차종명</label>
        <select id="vehicle"></select>
      </div>
      <div class="field">
        <label for="fuel">사용연료</label>
        <select id="fuel"></select>
      </div>
    </div>
    <div class="field">
      <label for="distance">실제 주행거리 (km)</label>
      <input type="number" id="distance" min="0" step="1" value="500">
    </div>
    <button id="calcBtn">계산하기</button>
  </div>

  <div class="card">
    <div class="compare-grid">
      <div class="compare-box" id="prevBox">
        <div class="label">리뉴얼 이전 포인트</div>
        <div class="value" id="prevPoint">0 P</div>
      </div>
      <div class="compare-box">
        <div class="label">총 주행 요금</div>
        <div class="value" id="totalFee">₩0</div>
      </div>
    </div>

    <div class="tier-title">Membership 별 포인트 (더 유리한 쪽이 강조됩니다)</div>
    <div class="grid" id="pctGrid"></div>

    <div class="tier-title">구간별 요율 상세</div>
    <div class="tier-table" id="tierTable"></div>
  </div>
</div>

<script>
const vehicles = [
  {name:"아반떼", fuel:"G", r1:250, r2:230, r3:210},
  {name:"트레일블레이저", fuel:"G", r1:270, r2:250, r3:220},
  {name:"GV70", fuel:"G", r1:310, r2:300, r3:290},
  {name:"GV60", fuel:"EV", r1:120, r2:120, r3:120},
  {name:"G80", fuel:"G", r1:330, r2:310, r3:290},
  {name:"카니발D", fuel:"D", r1:320, r2:300, r3:290},
  {name:"K5 H", fuel:"H", r1:190, r2:190, r3:190},
  {name:"쏘나타 H", fuel:"H", r1:190, r2:190, r3:190},
  {name:"K8 G", fuel:"G", r1:300, r2:290, r3:290},
  {name:"K8 H", fuel:"H", r1:210, r2:210, r3:210},
  {name:"K3", fuel:"G", r1:250, r2:230, r3:210},
  {name:"스포티지", fuel:"G", r1:280, r2:260, r3:240},
  {name:"EV6", fuel:"EV", r1:100, r2:100, r3:100},
  {name:"Ev3", fuel:"EV", r1:90, r2:90, r3:90},
  {name:"아이오닉5", fuel:"EV", r1:100, r2:100, r3:100},
  {name:"볼트EV", fuel:"EV", r1:60, r2:60, r3:60},
  {name:"쏘렌토", fuel:"G", r1:310, r2:300, r3:290},
  {name:"캐스퍼", fuel:"G", r1:260, r2:240, r3:220},
  {name:"니로 H", fuel:"H", r1:180, r2:180, r3:180},
  {name:"니로 EV", fuel:"EV", r1:80, r2:80, r3:80},
  {name:"토레스", fuel:"G", r1:290, r2:270, r3:260},
  {name:"트랙스", fuel:"G", r1:260, r2:250, r3:240},
  {name:"그랜저 3.3", fuel:"G", r1:350, r2:330, r3:320},
  {name:"레이", fuel:"G", r1:240, r2:220, r3:210},
  {name:"쏘나타 G", fuel:"G", r1:270, r2:250, r3:240},
  {name:"그랜저 2.5", fuel:"G", r1:300, r2:290, r3:290},
  {name:"카니발 G", fuel:"G", r1:360, r2:340, r3:320},
  {name:"셀토스", fuel:"G", r1:270, r2:250, r3:220},
  {name:"미니쿠퍼", fuel:"G", r1:280, r2:260, r3:240},
  {name:"XM3", fuel:"G", r1:250, r2:230, r3:220},
  {name:"투싼", fuel:"G", r1:280, r2:260, r3:240},
  {name:"코나 H", fuel:"H", r1:180, r2:180, r3:180},
  {name:"스타리아 H", fuel:"H", r1:250, r2:250, r3:250},
];

const fuelLabels = { G:"G · 가솔린", EV:"EV · 전기", H:"H · 하이브리드", D:"D · 디젤" };
const pctList = [15,12,10,8,6,4];
const gradeLabels = { 15:"G7 VVIP", 12:"G6 VIP", 10:"G5", 8:"G4", 6:"G3", 4:"G2" };
const PREV_RATE = 40;

const vehicleSel = document.getElementById('vehicle');
const fuelSel = document.getElementById('fuel');
const distanceInput = document.getElementById('distance');
const totalFeeEl = document.getElementById('totalFee');
const prevPointEl = document.getElementById('prevPoint');
const prevBoxEl = document.getElementById('prevBox');
const pctGrid = document.getElementById('pctGrid');
const tierTable = document.getElementById('tierTable');

function initFuelOptions(){
  fuelSel.innerHTML = '<option value="ALL">전체</option>' +
    Object.keys(fuelLabels).map(f => `<option value="${f}">${fuelLabels[f]}</option>`).join('');
}

function initVehicleOptions(){
  const fuel = fuelSel.value;
  const list = fuel === 'ALL' ? vehicles : vehicles.filter(v => v.fuel === fuel);
  vehicleSel.innerHTML = list.map(v => `<option value="${v.name}">${v.name}</option>`).join('');
}

function getSelectedVehicle(){
  return vehicles.find(v => v.name === vehicleSel.value);
}

function calcFee(distance, r1, r2, r3){
  if(distance <= 30) return distance * r1;
  if(distance <= 100) return 30*r1 + (distance-30) * r2;
  return 30*r1 + 70*r2 + (distance-100) * r3;
}

function pt(n){
  return Math.round(n).toLocaleString('ko-KR') + ' P';
}

function won(n){
  return '₩' + Math.round(n).toLocaleString('ko-KR');
}

function render(){
  const v = getSelectedVehicle();
  if(!v) return;
  const distance = Math.max(0, Number(distanceInput.value) || 0);
  const fee = calcFee(distance, v.r1, v.r2, v.r3);
  const prevValue = Math.round(distance * PREV_RATE);

  totalFeeEl.textContent = won(fee);
  prevPointEl.textContent = pt(prevValue);

  const pctValues = pctList.map(p => Math.round(fee * p / 100));
  const maxValue = Math.max(prevValue, ...pctValues);

  prevBoxEl.classList.toggle('highlight', prevValue === maxValue);

  pctGrid.innerHTML = pctList.map((p, i) => `
    <div class="pct-card${pctValues[i] === maxValue ? ' highlight' : ''}">
      <div class="pct">${gradeLabels[p]}</div>
      <div class="amt">${pt(pctValues[i])}</div>
    </div>
  `).join('');

  const tier1km = Math.min(distance, 30);
  const tier2km = Math.max(0, Math.min(distance, 100) - 30);
  const tier3km = Math.max(0, distance - 100);
  const rows = [
    ['1~30km', v.r1, tier1km],
    ['31~100km', v.r2, tier2km],
    ['101km~', v.r3, tier3km],
  ];

  tierTable.innerHTML = `
    <div class="tier-row head">
      <span>구간</span><span>요금/km</span><span>거리</span><span>소계</span>
    </div>
    ${rows.map(([label, rate, km]) => `
      <div class="tier-row${km === 0 ? ' zero' : ''}">
        <span>${label}</span>
        <span>${rate.toLocaleString('ko-KR')}원/km</span>
        <span>${km.toLocaleString('ko-KR')}km</span>
        <span>${won(rate * km)}</span>
      </div>
    `).join('')}
  `;
}

fuelSel.addEventListener('change', () => { initVehicleOptions(); render(); });
vehicleSel.addEventListener('change', render);
distanceInput.addEventListener('input', render);
document.getElementById('calcBtn').addEventListener('click', render);

initFuelOptions();
initVehicleOptions();
render();
</script>
</body>
</html>
